[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mk-agent-harness-kit"
version = "0.1.0"
description = "Portable contracts and loop gates for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["jsonschema"]

[project.scripts]
ack = "ack.cli:main"
cap = "ack.capcli:cap"
cap-check = "ack.capcli:cap_check"
cap-go = "ack.capcli:cap_go"
safe_move = "ack.capcli:safe_move"
safe_rsync = "ack.capcli:safe_rsync"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ack = ["_assets/**/*.json", "_assets/**/*.py", "_assets/**/*.yaml", "_assets/bin/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
