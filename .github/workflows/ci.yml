name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The cap gateway tests exercise the packaged bash tools; they need jq and rsync.
      - name: Install shell prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq rsync

      - name: Install kit (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest build twine

      - name: Test
        run: python -m pytest tests -q

      - name: Portability lint (no home-lab leakage in shipped code)
        run: ack portability-lint

      - name: Installed-command smoke
        run: |
          ack --help
          ack settings validate --settings settings.example.json
          cap help

      - name: Build sdist + wheel and check metadata
        run: |
          python -m build
          twine check dist/*
