name: Release

# Triggered by pushing a version tag (v0.1.0, v0.2.0, ...).
# Builds sdist + wheel, checks the tag matches pyproject, and creates the GitHub
# release with the artifacts attached. PyPI upload is done by the maintainer
# locally (`uv build && twine upload dist/*`); switch the publish job to
# pypa/gh-action-pypi-publish with trusted publishing when that is configured.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Tag must match pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$ver" || { echo "tag v$tag != pyproject $ver"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: GitHub release with the built artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
